# Cargo-deny configuration for security advisories

[advisories]
# List of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered, unless they are also yanked.
#
# Note: We rely on cargo audit for RSA timing sidechannel (RUSTSEC-2023-0071)
# since cargo deny's database doesn't match it.
ignore = [
    # RUSTSEC-2025-0057: fxhash unmaintained
    # - Status: Unmaintained
    # - Impact: Low (hash function library, no security-critical usage)
    # - Why ignored: Transitive dep via servo/selectors → scraper. We use scraper for
    #   web scraping only. fxhash performance characteristics don't affect security.
    # - Reviewed: 2026-06-22
    "RUSTSEC-2025-0057",

    # RUSTSEC-2026-0173: proc-macro-error2 unmaintained
    # - Status: Unmaintained with no safe upgrade
    # - Impact: Low (only used in proc macros, not runtime)
    # - Why ignored: Transitive dep via sea-orm-macros. Both original proc-macro-error
    #   and this fork are unmaintained. sea-orm uses it for derive macro generation only.
    # - Reviewed: 2026-06-22
    "RUSTSEC-2026-0173",

    # RUSTSEC-2026-0097: Rand unsound with custom logger
    # - Status: Unsound but requires specific misuse pattern
    # - Impact: Low (requires custom logger using rand::rng() which we don't do)
    # - Why ignored: Transitive dep via sqlx-postgres and quinn. The unsoundness only
    #   manifests if custom loggers call rand::rng(). We don't have custom loggers.
    # - Reviewed: 2026-06-22
    "RUSTSEC-2026-0097",
]

[licenses]
# Allow all licenses for development
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "CC0-1.0", "AGPL-3.0", "MPL-2.0", "OpenSSL", "BSL-1.0", "Zlib", "WTFPL", "Unlicense", "0BSD"]

[bans]
# Skip certain crates during duplicate detection
skip = [
    # Allow duplicate windows_* versions due to transitive dependencies
    { name = "windows_x86_64_msvc" },
    { name = "windows_x86_64_gnullvm" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_i686_msvc" },
    { name = "windows_i686_gnu" },
    { name = "windows_aarch64_gnullvm" },
    { name = "windows_aarch64_msvc" },
    { name = "windows-targets" },
]

# Skip certain crates during version mismatch detection
skip-tree = []

[sources]
# Allow unknown registries
unknown-registry = "warn"
# Allow unknown git sources
unknown-git = "warn"
